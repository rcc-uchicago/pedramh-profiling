### E3SM ALL-DATA, PORT G: the ACE2-EAMv3 variable set on the 101-channel pack.
###
### Operator decision rmehta1987 2026-09-29: remove every prognostic channel that has
### no counterpart in ai2's ACE2-EAMv3 contract (ace2_e3sm_channel_contract.md §3.2):
###     SOILWATER_10CM, TSOI_10CM (port F), Z3_l00..17, U10, RHREFHT, PSL, TMQ.
### KEPT on purpose: RELHUM_l00..17 (stands in for ACE2's specific_total_water_0..7)
### and TREFHT (stands in for ACE2's TS, which ACE2 overwrites over ocean).
### Differences from e3sm_alldata_nosoil.yaml, and NOTHING else:
###     root key, dropped_channel_names 2 -> 24, channel_names 99 -> 77, n_state 98 -> 76.
### => 76 state + 1 diag (PRECT, still LAST) + 7 forcing: 83-in / 77-out.
###
### ⚠ SCIENCE CONSEQUENCES, not a neutral cleanup (variable sets are jesswan's call):
###   - no land-surface memory (as port F), no geopotential, no column water;
###   - TMQ is gone, so the dry-air fix (mass_fix.DryAirFix: dry mass = PS - TMQ*g)
###     has no input on this model. It refuses by name rather than guess a proxy;
###   - FSNT / FSNTOA stay PROGNOSTIC here. ACE2 keeps every radiative flux as an
###     output-only diagnostic; moving them needs a repack (the pack's diagnostic
###     group holds PRECT only), so it is not part of this port.
###
### SAME PACK FILES, SAME CONVERTER CONTRACT. The pack keeps all 101 channels; makani
### indexes the full-width stats by params.out_channels. The launcher runs
### channel_subset_gate.py on this file and aborts on drift.
### PACK (the launcher's -v PACK=, chosen by submit_g_ace2vars.sh SPLIT=): G proper runs
### on the PRODUCTION pack (train 2015-2044, A's/F's stats), so the variable set is its
### only change from F. The 2020-2044 train view is a SEPARATE split experiment
### (SPLIT=2020; operator 2026-09-30), not part of G.
###
### ⚠ Every existing baseline is a 101- or 99-channel number. Compare G on the common
### 77 channels only (k56_readout_common77.json); a SPLIT=2020 run also states its split.
###
### Cannot warm-start from prod1n_b32_sgdr or F unsliced (encoder/decoder widths
### change; strict restore refuses). slice_checkpoint.py can cut A to 83/77:
###   --n-in 107 --n-out 101 --drop 2 3 4 5 8 9 64 65 ... 81
### (all 24 dropped indices are state channels, so they sit at the same positions
### on the input and output side). On the production pack A's stats are G's stats.
###
### {{OUTPUT_ROOT}} / {{EXP_DIR}} are placeholders substituted by the launcher.

e3sm_alldata_ace2vars:

    # --- Dataset paths ---
    metadata_json_path: "{{OUTPUT_ROOT}}/metadata/data.json"
    train_data_path:   "{{OUTPUT_ROOT}}/train"
    valid_data_path:   "{{OUTPUT_ROOT}}/valid"
    inf_data_path:     "{{OUTPUT_ROOT}}/test"
    exp_dir:           "{{EXP_DIR}}"

    # --- Image / time (E3SM: 1-degree equiangular, 6-hourly) ---
    img_shape_x: 180
    img_shape_y: 360
    dhours: 6
    dt: 1
    multifiles: !!bool True

    # --- Grids (E3SM is equiangular, NOT legendre-gauss) ---
    model_grid_type: "equiangular"
    data_grid_type:  "equiangular"
    sht_grid_type:   "equiangular"

    # --- Channels (101 = 100 state + PRECT; must match metadata coords.channel) ---
    # channel_names is PINNED here on purpose (yaml cannot import the converter):
    # it is the trainer-side half of the converter<->trainer gate and must equal
    # TARGET_CHANNELS exactly — same-width name drift maps channels to the wrong
    # slots with no error. Keep it identical to e3sm_alldata_smoke.yaml, whose
    # PBS smoke re-derives both sides and aborts on drift. Regenerate (from
    # makani_sfno/polaris/):
    #   python -c 'import json, convert_e3sm_to_makani_alldata as c; print("["+",".join(json.dumps(n) for n in c.TARGET_CHANNELS)+"]")'
    # PORT G (2026-09-29): TARGET_CHANNELS minus dropped_channel_names, in order.
    # The pack keeps all 101; makani's parse_dataset_metadata maps these names to
    # pack indices and plasim_trainer._plasim_channel_indices reads with them.
    # channel_subset_gate.py (run by the launcher) aborts on any drift. Regenerate:
    #   python -c 'import json, convert_e3sm_to_makani_alldata as c; d={"U10","RHREFHT","PSL","TMQ","SOILWATER_10CM","TSOI_10CM"}|{f"Z3_l{i:02d}" for i in range(18)}; print("["+",".join(json.dumps(n) for n in c.TARGET_CHANNELS if n not in d)+"]")'
    dropped_channel_names: ["U10","RHREFHT","PSL","TMQ","SOILWATER_10CM","TSOI_10CM","Z3_l00","Z3_l01","Z3_l02","Z3_l03","Z3_l04","Z3_l05","Z3_l06","Z3_l07","Z3_l08","Z3_l09","Z3_l10","Z3_l11","Z3_l12","Z3_l13","Z3_l14","Z3_l15","Z3_l16","Z3_l17"]
    channel_names: ["PS","TREFHT","FSNT","FSNTOA","T_l00","T_l01","T_l02","T_l03","T_l04","T_l05","T_l06","T_l07","T_l08","T_l09","T_l10","T_l11","T_l12","T_l13","T_l14","T_l15","T_l16","T_l17","U_l00","U_l01","U_l02","U_l03","U_l04","U_l05","U_l06","U_l07","U_l08","U_l09","U_l10","U_l11","U_l12","U_l13","U_l14","U_l15","U_l16","U_l17","V_l00","V_l01","V_l02","V_l03","V_l04","V_l05","V_l06","V_l07","V_l08","V_l09","V_l10","V_l11","V_l12","V_l13","V_l14","V_l15","V_l16","V_l17","RELHUM_l00","RELHUM_l01","RELHUM_l02","RELHUM_l03","RELHUM_l04","RELHUM_l05","RELHUM_l06","RELHUM_l07","RELHUM_l08","RELHUM_l09","RELHUM_l10","RELHUM_l11","RELHUM_l12","RELHUM_l13","RELHUM_l14","RELHUM_l15","RELHUM_l16","RELHUM_l17","PRECT"]

    diagnostic_h5_path: "fields_diagnostic"
    n_state_channels: 76   # 100 - 24 dropped; inputs 83 = 76 + 7 forcing, outputs 77
    n_diagnostic_channels: 1
    forcing_h5_path: "forcing"
    n_forcing_channels: 7
    forcing_channel_names: ["lsm","topo","glacier","natveg","sst","solin","ice"]
    forcing_global_means_path: "{{OUTPUT_ROOT}}/stats/forcing_global_means.npy"
    forcing_global_stds_path:  "{{OUTPUT_ROOT}}/stats/forcing_global_stds.npy"
    forcing_time_means_path:   "{{OUTPUT_ROOT}}/stats/forcing_time_means.npy"

    # --- Normalization ---
    normalization: "zscore"
    global_means_path: "{{OUTPUT_ROOT}}/stats/global_means.npy"
    global_stds_path:  "{{OUTPUT_ROOT}}/stats/global_stds.npy"
    time_means_path:   "{{OUTPUT_ROOT}}/stats/time_means.npy"

    # --- SFNO (dims from plasim_sim52_baseline.yaml, same as e3sm_full.yaml) ---
    nettype: "SFNO"
    filter_type: "linear"
    scale_factor: 3
    embed_dim: 384
    num_layers: 8
    complex_activation: "real"
    normalization_layer: "instance_norm"
    hard_thresholding_fraction: 1.0
    use_mlp: !!bool True
    mlp_mode: "serial"
    mlp_ratio: 2
    separable: !!bool False
    operator_type: "dhconv"
    activation_function: "gelu"
    pos_embed: "none"

    # --- Aux features all OFF (asserted by PlasimTrainer._set_data_shapes) ---
    add_grid:      !!bool False
    add_zenith:    !!bool False
    add_orography: !!bool False
    add_landmask:  !!bool False
    add_soiltype:  !!bool False
    history_normalization_mode: "none"

    # --- Loss ---
    # constant channel weights over the 101 targets. The zero-variance dilution
    # concern is GONE: the cloud channels (16 of them exactly constant) are
    # excluded from the pack entirely, so no target normalizes to a constant 0.
    losses:
    -   type: "l2"
        channel_weights: "constant"
        temp_diff_normalization: !!bool False
        parameters:
            squared: !!bool True

    # --- Full training (batch_size is GLOBAL and is overridden on the CLI) ---
    # makani asserts global_batch_size % data_parallel_size == 0, so the launcher passes a
    # multiple of the rank count; the value here is the single-node default from the baseline.
    lr: 1.0E-3
    n_eval_samples: 512
    n_train_samples_per_epoch: 8192
    max_epochs: 100
    batch_size: 8
    weight_decay: 0.0
    n_history: 0
    n_future: 0
    valid_autoreg_steps: 3
    prediction_type: "iterative"

    scheduler: "ReduceLROnPlateau"
    scheduler_T_max: 100
    scheduler_factor: 0.5
    scheduler_patience: 1
    scheduler_step_size: 1
    scheduler_gamma: 0.5
    lr_warmup_steps: 0
    optimizer_type: "AdamW"
    optimizer_beta1: 0.9
    optimizer_beta2: 0.95
    optimizer_max_grad_norm: 32

    num_data_workers: 8
    num_visualization_workers: 0
    crop_size_x: None
    crop_size_y: None

    ics_type: "specify_number"
    save_raw_forecasts: !!bool True
    save_channel:       !!bool False
    masked_acc:         !!bool False
    maskpath: None
    perturb:    !!bool False
    add_noise:  !!bool False
    noise_std:  0.0
    pretrained: !!bool False

    target: "tendency"
    normalize_residual: !!bool False

    log_to_screen: !!bool True
    log_to_wandb:  !!bool False
    log_video: 0
    save_checkpoint: "legacy"
    # EMA (port D, handoff §4) -- ON, as for the F run (operator, 2026-09-23). A shadow of the
    # weights: training is unchanged, it adds an EMA validation pass and best_ckpt_ema_mp0.tar.
    # decay 0.9995 ~ 1/(1-d) = 2000 updates ~ 1.75 epochs at 1140 updates/epoch (the
    # 2020-2044 view: 36,500 samples / global batch 32). -v EMA=0
    # turns it off. Flow form on ONE line: the launcher rewrites flat keys line-by-line.
    # Needs save_checkpoint AND load_checkpoint legacy (plasim_trainer.py EMA guard).
    ema: {enabled: !!bool True, decay: 0.9995}
    verbose: !!bool True

    wireup_info: "mpi"
    wireup_store: "tcp"
